name: One-time live audit

on:
  push:
    paths:
      - ".github/workflows/live-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture live DNS and headers
        run: |
          {
            echo "=== DATE ==="
            date -u
            echo
            echo "=== DNS ==="
            getent ahostsv4 silviusholdings.com || true
            echo
            echo "=== HEADERS ==="
            curl -sSIL --max-redirs 5 https://silviusholdings.com/
            echo
            echo "=== VERIFY FILE ==="
            curl -sS https://silviusholdings.com/google3df77f77073af3c4.html || true
          } > live-audit.txt
      - name: Commit audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-audit.txt
          git commit -m "Record one-time live site audit"
          git push
